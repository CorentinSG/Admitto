name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, garde-fous
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # cache ~/.npm keyed sur package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Vocabulaire interdit (CDC §5–7)
        run: npm run check:vocabulary

      - name: Couleurs hors palette (design system)
        run: npm run check:tokens

      - name: Règles du Moteur A sourcées et datées (CDC §14.1)
        run: npm run check:rules

      - name: Skills de projet bien formés
        run: npm run check:skills

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires (moteurs A/B, stores en mémoire)
        run: npm run test

  # Le contrat des stores est vérifié une seconde fois contre une vraie base :
  # les deux implémentations (mémoire et Prisma) partagent lib/store/stores.test.ts,
  # et c'est ce second passage qui empêche la version Prisma de diverger sans
  # que rien ne le signale.
  database:
    name: Contrat des stores sur PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admitto
          POSTGRES_PASSWORD: admitto
          POSTGRES_DB: admitto
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://admitto:admitto@localhost:5432/admitto
      # Auth.js exige un secret pour se charger, même hors test de connexion.
      AUTH_SECRET: secret-de-ci-sans-valeur-en-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Migrations
        run: npm run db:deploy

      - name: Tests contre la base
        run: npm run test

  build:
    name: Build Next.js (cache .next/cache)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Cache du compilateur Next.js : accélère fortement les builds successifs.
      # Clé primaire sur lockfile + sources ; restore-keys pour réutiliser le
      # cache le plus récent même si les sources ont changé.
      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
