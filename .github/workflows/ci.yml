name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, garde-fous
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # cache ~/.npm keyed sur package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Vocabulaire interdit (CDC §5–7)
        run: npm run check:vocabulary

      - name: Couleurs hors palette (design system)
        run: npm run check:tokens

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires (moteurs A/B)
        run: npm run test

  build:
    name: Build Next.js (cache .next/cache)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Cache du compilateur Next.js : accélère fortement les builds successifs.
      # Clé primaire sur lockfile + sources ; restore-keys pour réutiliser le
      # cache le plus récent même si les sources ont changé.
      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
